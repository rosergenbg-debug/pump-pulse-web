name: V14 SOL OOS
on:
  push:
    branches: ["research/v14-sol-oos-2026-02"]
    paths:
      - "tools/v14_sol_oos.js"
      - "tools/v14_sol_6m_wrapper.mjs"
      - "tools/compare_volatility_and_replay.mjs"
      - ".github/workflows/v14-sol-oos.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run one-month replay
        run: node tools/v14_sol_oos.js | tee v14_sol_oos_summary.txt
      - name: Run six-month replay
        run: node tools/v14_sol_6m_wrapper.mjs | tee v14_sol_6m_summary.txt
      - name: Match volatility and replay closest market
        run: node tools/compare_volatility_and_replay.mjs | tee volatility_v14_crossmarket_summary.txt
      - name: Replay same frozen V14 on PUMP
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/compare_volatility_and_replay.mjs').read_text()
          p=p.replace("const chosen=ranked[0]?.[0];", "const chosen='PUMPUSDT';")
          p=p.replace("volatility_v14_crossmarket_result.json", "v14_pump_same_span_result.json")
          Path('/tmp/v14_pump_same_span.mjs').write_text(p)
          PY
          node /tmp/v14_pump_same_span.mjs | tee v14_pump_same_span_summary.txt
      - name: Replay same frozen V14 on BONK
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/compare_volatility_and_replay.mjs').read_text()
          p=p.replace("const chosen=ranked[0]?.[0];", "const chosen='BONKUSDT';")
          p=p.replace("volatility_v14_crossmarket_result.json", "v14_bonk_same_span_result.json")
          Path('/tmp/v14_bonk_same_span.mjs').write_text(p)
          PY
          node /tmp/v14_bonk_same_span.mjs | tee v14_bonk_same_span_summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v14-crossmarket-research
          path: |
            v14_sol_oos_summary.txt
            v14_sol_oos_result.json
            v14_sol_6m_summary.txt
            v14_sol_6m_result.json
            volatility_v14_crossmarket_summary.txt
            volatility_v14_crossmarket_result.json
            v14_pump_same_span_summary.txt
            v14_pump_same_span_result.json
            v14_bonk_same_span_summary.txt
            v14_bonk_same_span_result.json
